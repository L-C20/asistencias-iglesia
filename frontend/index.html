<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Iglesia</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        /* LOGIN MODERNO */
        body.login-mode {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-page {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 32px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .login-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #ef4444;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e5e7eb;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .login-page {
                margin: 16px;
                padding: 32px 20px;
            }
            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body class="login-mode">
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-page">
        <div class="login-header">
            <div class="login-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
                    <path d="M12 6v6l4 2"></path>
                </svg>
            </div>
            <h1>Asistencia</h1>
            <p>Orquesta y Coro</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username" required>
            </div>
            <div class="login-form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText">Iniciar Sesión</span>
                <span class="loading" id="loading"><span class="spinner"></span>Cargando...</span>
            </button>
        </form>

        <div class="footer-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline; margin-right:4px;">
                <circle cx="12" cy="12" r="10"></circle>
            </svg>
            Acceso seguro
        </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="dashboard-page" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Sistema</h1>
                <p>Asistencia</p>
            </div>

            <ul class="sidebar-menu">
                <li><div class="sidebar-menu-item" onclick="cambiarTab('inicio')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Inicio</span>
                </div></li>
                <li><div class="sidebar-menu-item" onclick="cambiarTab('coro-miembros')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Coro</span>
                </div></li>
                <li><div class="sidebar-menu-item" onclick="cambiarTab('orquesta-miembros')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 3a6 6 0 0 0-6 6v12"></path>
                        <path d="M6 9a4 4 0 0 0 4 4"></path>
                        <circle cx="9" cy="3" r="1.5"></circle>
                    </svg>
                    <span>Orquesta</span>
                </div></li>
                <li><div class="sidebar-menu-item" onclick="cambiarTab('reportes')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="9" y2="15"></line>
                        <line x1="15" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>Reportes</span>
                </div></li>
                <li><div class="sidebar-menu-item" onclick="cambiarTab('configuracion')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6"></path>
                        <path d="M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24"></path>
                        <path d="M1 12h6m6 0h6"></path>
                        <path d="M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"></path>
                    </svg>
                    <span>Configuración</span>
                </div></li>
            </ul>

            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width: 100%;" onclick="logout(); return false;">Salir</button>
            </div>
        </div>

        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

        <div class="main-content" id="mainContent">
            <nav class="navbar">
                <h1>Panel de Asistencia</h1>
                <span id="usuarioActual" class="usuario-info"></span>
            </nav>

            <div class="container">
                <!-- INICIO, CORO, ORQUESTA, ASISTENCIA, REPORTES, CONFIGURACIÓN AQUÍ -->
                <!-- Copiar todo el contenido de tabs de arriba -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function handleLogin(event) {
            event.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const btnLogin = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');

            if (!usuario || !password) {
                mostrarErrorLogin('Por favor completa todos los campos');
                return;
            }

            btnLogin.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'inline';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', usuario);
                    window.location.href = '/';
                } else {
                    mostrarErrorLogin(data.error || 'Error al iniciar sesión');
                }
            } catch (error) {
                mostrarErrorLogin('Error de conexión');
            } finally {
                btnLogin.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        }

        function mostrarErrorLogin(mensaje) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = mensaje;
            errorDiv.classList.add('show');
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        });

        window.addEventListener('load', () => {
            document.getElementById('usuario').focus();
        });
    </script>
    <script src="js/miembros.js"></script>
    <script src="js/asistencia.js"></script>
    <script src="js/reportes.js"></script>
    <script src="js/configuracion.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
