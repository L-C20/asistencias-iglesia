<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Asistencia</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body class="dashboard-page">
    
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Sistema</h1>
            <p>Asistencia</p>
        </div>

        <ul class="sidebar-menu">
            <li>
                <div class="sidebar-menu-item active" onclick="cambiarTab('coro'); cerrarSidebarMobil()">
                    <span>●</span>
                    <span>Coro</span>
                </div>
            </li>
            <li>
                <div class="sidebar-menu-item" onclick="cambiarTab('orquesta'); cerrarSidebarMobil()">
                    <span>●</span>
                    <span>Orquesta</span>
                </div>
            </li>
            <li>
                <div class="sidebar-menu-item" onclick="cambiarTab('reportes'); cerrarSidebarMobil()">
                    <span>●</span>
                    <span>Reportes</span>
                </div>
            </li>
        </ul>

        <div class="sidebar-footer">
            <button class="btn btn-danger" style="width: 100%; margin: 0;" id="logoutBtn">Salir</button>
        </div>
    </div>

    <!-- TOGGLE BUTTON -->
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
        
        <!-- NAVBAR -->
        <nav class="navbar">
            <h1>Panel de Asistencia</h1>
            <div class="navbar-buttons">
                <span id="usuarioActual" class="usuario-info"></span>
            </div>
        </nav>

        <!-- CONTAINER -->
        <div class="container">
            
            <!-- TAB: CORO -->
            <div id="coro" class="tab-content active">
                <div class="tab-header">
                    <h2>Coro</h2>
                    <div class="controls">
                        <select id="tipoEventoCoro" class="form-control">
                            <option value="santo_culto">Santo Culto</option>
                            <option value="ensayo">Ensayo</option>
                        </select>
                        <input type="date" id="fechaCoro" class="form-control">
                        <button class="btn btn-success" onclick="cargarMiembros('coro')">Cargar</button>
                    </div>
                </div>

                <div class="tabla-container">
                    <table class="tabla-miembros tabla-asistencia-inline">
                        <thead>
                            <tr>
                                <th style="width: 40%;">Nombre</th>
                                <th style="width: 20%;">Voz</th>
                                <th style="width: 15%; text-align: center;">P</th>
                                <th style="width: 15%; text-align: center;">A</th>
                                <th style="width: 10%; text-align: center;">AJ</th>
                            </tr>
                        </thead>
                        <tbody id="coroTableBody">
                            <tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-light);">Cargando miembros...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="tab-footer">
                    <button class="btn btn-primary" onclick="agregarMiembroCoro()">Agregar Miembro</button>
                </div>
            </div>

            <!-- TAB: ORQUESTA -->
            <div id="orquesta" class="tab-content">
                <div class="tab-header">
                    <h2>Orquesta</h2>
                    <div class="controls">
                        <select id="tipoEventoOrquesta" class="form-control">
                            <option value="santo_culto">Santo Culto</option>
                            <option value="ensayo">Ensayo</option>
                        </select>
                        <input type="date" id="fechaOrquesta" class="form-control">
                        <button class="btn btn-success" onclick="cargarMiembros('orquesta')">Cargar</button>
                    </div>
                </div>

                <div class="tabla-container">
                    <table class="tabla-miembros tabla-asistencia-inline">
                        <thead>
                            <tr>
                                <th style="width: 40%;">Nombre</th>
                                <th style="width: 20%;">Instrumento</th>
                                <th style="width: 15%; text-align: center;">P</th>
                                <th style="width: 15%; text-align: center;">A</th>
                                <th style="width: 10%; text-align: center;">AJ</th>
                            </tr>
                        </thead>
                        <tbody id="orquestaTableBody">
                            <tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-light);">Cargando miembros...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="tab-footer">
                    <button class="btn btn-primary" onclick="agregarMiembroOrquesta()">Agregar Miembro</button>
                </div>
            </div>

            <!-- TAB: REPORTES -->
            <div id="reportes" class="tab-content">
                <div class="tab-header">
                    <h2>Reportes</h2>
                </div>
                <div class="reportes-container">
                    <div class="reporte-section">
                        <h3>Selecciona un grupo:</h3>
                        <div class="reporte-buttons">
                            <button class="btn btn-info" onclick="cargarReporte('coro')">Reportes Coro</button>
                            <button class="btn btn-info" onclick="cargarReporte('orquesta')">Reportes Orquesta</button>
                        </div>
                    </div>
                    
                    <div id="reporteContent" class="reporte-content">
                        <!-- Se llena con JavaScript -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal para agregar miembro -->
    <div id="modalAgregarMiembro" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h3>Agregar Nuevo Miembro</h3>
            <form id="formNuevoMiembro">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombreNuevo" required>
                </div>
                
                <div class="form-group" id="formInstrumento">
                    <label id="labelInstrumento">Instrumento:</label>
                    <select id="instrumentoNuevo" class="form-control" style="display: none;">
                        <option value="">-- Seleccionar instrumento --</option>
                    </select>
                </div>
                
                <div class="form-group" id="formVoz">
                    <label id="labelVoz">Voz:</label>
                    <select id="vozNueva" class="form-control" style="display: none;">
                        <option value="">-- Seleccionar voz --</option>
                    </select>
                </div>
                
                <input type="hidden" id="grupoNuevo">
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-success" style="flex: 1;">Agregar</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/asistencia.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
