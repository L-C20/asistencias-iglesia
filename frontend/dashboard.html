<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Asistencia</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <h1>📋 Asistencia - Orquesta y Coro</h1>
            <div class="navbar-buttons">
                <span id="usuarioActual" class="usuario-info"></span>
                <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" data-tab="coro">🎤 Coro</button>
            <button class="tab-button" data-tab="orquesta">🎻 Orquesta</button>
            <button class="tab-button" data-tab="reportes">📊 Reportes</button>
        </div>

        <!-- TAB: CORO -->
        <div id="coro" class="tab-content active">
            <div class="tab-header">
                <h2>Coro</h2>
                <div class="controls">
                    <select id="tipoEventoCoro" class="form-control">
                        <option value="santo_culto">Santo Culto</option>
                        <option value="ensayo">Ensayo</option>
                    </select>
                    <input type="date" id="fechaCoro" class="form-control">
                    <button class="btn btn-success" onclick="cargarMiembros('coro')">Cargar</button>
                </div>
            </div>
            <div id="coroList" class="miembros-list"></div>
            <div class="tab-footer">
                <button class="btn btn-primary" onclick="agregarMiembroCoro()">+ Agregar Miembro</button>
            </div>
        </div>

        <!-- TAB: ORQUESTA -->
        <div id="orquesta" class="tab-content">
            <div class="tab-header">
                <h2>Orquesta</h2>
                <div class="controls">
                    <select id="tipoEventoOrquesta" class="form-control">
                        <option value="santo_culto">Santo Culto</option>
                        <option value="ensayo">Ensayo</option>
                    </select>
                    <input type="date" id="fechaOrquesta" class="form-control">
                    <button class="btn btn-success" onclick="cargarMiembros('orquesta')">Cargar</button>
                </div>
            </div>
            <div id="orquestaList" class="miembros-list"></div>
            <div class="tab-footer">
                <button class="btn btn-primary" onclick="agregarMiembroOrquesta()">+ Agregar Miembro</button>
            </div>
        </div>

        <!-- TAB: REPORTES -->
        <div id="reportes" class="tab-content">
            <div class="tab-header">
                <h2>📊 Reportes</h2>
            </div>
            <div class="reportes-container">
                <div class="reporte-section">
                    <h3>Selecciona un grupo:</h3>
                    <div class="reporte-buttons">
                        <button class="btn btn-info" onclick="cargarReporte('coro')">📈 Reportes Coro</button>
                        <button class="btn btn-info" onclick="cargarReporte('orquesta')">📈 Reportes Orquesta</button>
                    </div>
                </div>
                
                <div id="reporteContent" class="reporte-content">
                    <!-- Se llena con JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar miembro -->
    <div id="modalAgregarMiembro" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h3>Agregar Nuevo Miembro</h3>
            <form id="formNuevoMiembro">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombreNuevo" required>
                </div>
                
                <div class="form-group" id="formInstrumento">
                    <label id="labelInstrumento">Instrumento:</label>
                    <select id="instrumentoNuevo" class="form-control" style="display: none;">
                        <option value="">-- Seleccionar instrumento --</option>
                    </select>
                </div>
                
                <div class="form-group" id="formVoz">
                    <label id="labelVoz">Voz:</label>
                    <select id="vozNueva" class="form-control" style="display: none;">
                        <option value="">-- Seleccionar voz --</option>
                    </select>
                </div>
                
                <input type="hidden" id="grupoNuevo">
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-success" style="flex: 1;">Agregar</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="cerrarModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para tabla de miembros -->
    <div id="modalTablaMiembros" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="cerrarModalTabla()">&times;</span>
            <h3>Miembros del Grupo</h3>
            
            <div class="form-group">
                <label>Filtrar:</label>
                <input type="text" id="filtroMiembros" class="form-control" placeholder="Buscar por instrumento o voz...">
            </div>
            
            <div style="overflow-x: auto;">
                <table class="tabla-asistencia">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instrumento / Voz</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMiembrosBody">
                        <!-- Se llena con JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-secondary" onclick="cerrarModalTabla()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/asistencia.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
